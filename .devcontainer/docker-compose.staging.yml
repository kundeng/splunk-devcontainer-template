# Staging Splunk — separate instance for testing packaged apps.
# Mounts infra/deps/ so tgz files are available at /tmp/apps/.
# The entrypoint auto-discovers and installs them on first start.
# You can also install apps manually via Splunk Web or CLI.
# Runs on different ports so dev and staging can coexist.
# Start with: task splunk:up-staging
# Stop with:  task splunk:down-staging

services:
  splunk-staging:
    platform: linux/amd64
    build:
      context: ../infra
      dockerfile: Dockerfile
      target: dev
      args:
        SPLUNK_VERSION: ${SPLUNK_VERSION:-10.2.1}
    container_name: splunk-staging
    hostname: splunk-staging
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-admin123}
      ANSIBLE_DEPRECATION_WARNINGS: "false"
      ANSIBLE_SYSTEM_WARNINGS: "false"
      ANSIBLE_ACTION_WARNINGS: "false"
      ANSIBLE_PIPELINING: "true"
    ports:
      - "18000:8000"   # Splunk Web (staging)
      - "18089:8089"   # splunkd REST API (staging)
      - "18088:8088"   # HTTP Event Collector (staging)
    volumes:
      # Packaged apps — entrypoint auto-discovers *.tgz and installs on first start
      - ${LOCAL_WORKSPACE_FOLDER:-..}/infra/deps:/tmp/apps
      - splunk-staging-var:/opt/splunk/var
      - splunk-staging-etc:/opt/splunk/etc
    restart: unless-stopped

volumes:
  splunk-staging-var:
  splunk-staging-etc:
