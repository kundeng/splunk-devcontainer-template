name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          sudo apt-get install -y shellcheck
          find infra/ -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning || true

  ucc-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Find UCC app
        id: find
        run: |
          # Find first directory under apps/ that has a globalConfig.json
          APP_DIR=$(find apps/ -maxdepth 2 -name "globalConfig.json" -printf "%h\n" | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "No UCC app found — skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            APP_NAME=$(basename "$APP_DIR")
            echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
            echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install UCC framework
        if: steps.find.outputs.skip != 'true'
        run: pip install splunk-add-on-ucc-framework

      - name: UCC build
        if: steps.find.outputs.skip != 'true'
        working-directory: ${{ steps.find.outputs.app_dir }}
        run: |
          ucc-gen build --source package --config globalConfig.json --output-dir ../output

      - name: Post-build fixups
        if: steps.find.outputs.skip != 'true'
        run: |
          APP="output/${{ steps.find.outputs.app_name }}"
          # Merge conf fragments
          FRAG_DIR="${{ steps.find.outputs.app_dir }}/package/default.d"
          if [ -d "${FRAG_DIR}" ]; then
            for frag in "${FRAG_DIR}"/*.conf; do
              [ -f "${frag}" ] || continue
              target="${APP}/default/$(basename "${frag}")"
              echo "" >> "${target}"
              cat "${frag}" >> "${target}"
            done
          fi
          # Add python.required for Splunk 10.2+
          for conf in "${APP}/default/restmap.conf" "${APP}/default/inputs.conf"; do
            if [ -f "${conf}" ]; then
              sed -i '/^python\.version\s*=/a python.required = 3.9' "${conf}"
            fi
          done

      - name: Install AppInspect
        if: steps.find.outputs.skip != 'true'
        run: pip install splunk-appinspect

      - name: Run AppInspect
        if: steps.find.outputs.skip != 'true'
        run: |
          splunk-appinspect inspect "output/${{ steps.find.outputs.app_name }}" \
            --mode precert \
            --included-tags cloud 2>&1 | tee appinspect.log
          if grep -qE "^\s+error:\s+[1-9]|^\s+failure:\s+[1-9]" appinspect.log; then
            echo "AppInspect found errors or failures"
            exit 1
          fi
