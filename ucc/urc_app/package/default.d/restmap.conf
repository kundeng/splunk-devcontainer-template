# Custom REST endpoints (appended to UCC-generated restmap.conf after build)

[script:urc_test_connection]
match = /urc_app/test_connection
script = urc_test_connection.py
scripttype = persist
handler = urc_test_connection.TestConnectionHandler
requireAuthentication = true
output_mode = json
passPayload = true
passHttpHeaders = true
python.version = python3
