# UCC auto-generated admin handlers (must be included here because UCC's
# file-copy from package/default/ overwrites the auto-generated restmap.conf).

[admin:urc_app_configuration]
match = /
members = urc_app_account, urc_app_settings

[admin:urc_app_inputs]
match = /
members = urc_app_urc_app_input

[admin_external:urc_app_account]
handlertype = python
python.version = python3
handlerfile = urc_app_rh_account.py
handleractions = edit, list, remove, create
handlerpersistentmode = true

[admin_external:urc_app_settings]
handlertype = python
python.version = python3
handlerfile = urc_app_rh_settings.py
handleractions = edit, list
handlerpersistentmode = true

[admin_external:urc_app_urc_app_input]
handlertype = python
python.version = python3
handlerfile = urc_app_rh_urc_app_input.py
handleractions = edit, list, remove, create
handlerpersistentmode = true

# Custom REST endpoints

[script:urc_test_connection]
match = /urc_app/test_connection
script = urc_test_connection.py
scripttype = persist
handler = urc_test_connection.TestConnectionHandler
requireAuthentication = true
output_mode = json
passPayload = true
passHttpHeaders = true
python.version = python3
