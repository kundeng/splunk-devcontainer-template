# Custom web.conf entries for React UI REST API access.
# These expose standard data/inputs/ paths through SplunkWeb proxy.

[expose:data_inputs_urc_app_input]
pattern = data/inputs/urc_app_input
methods = POST, GET

[expose:data_inputs_urc_app_input_specified]
pattern = data/inputs/urc_app_input/*
methods = POST, GET, DELETE
