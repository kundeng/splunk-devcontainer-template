# UCC auto-generated expose entries (must be included here because UCC's
# file-copy from package/default/ overwrites the auto-generated web.conf).

[expose:urc_app_account]
pattern = urc_app_account
methods = POST, GET

[expose:urc_app_account_specified]
pattern = urc_app_account/*
methods = POST, GET, DELETE

[expose:urc_app_settings]
pattern = urc_app_settings
methods = POST, GET

[expose:urc_app_settings_specified]
pattern = urc_app_settings/*
methods = POST, GET, DELETE

[expose:urc_app_urc_app_input]
pattern = urc_app_urc_app_input
methods = POST, GET

[expose:urc_app_urc_app_input_specified]
pattern = urc_app_urc_app_input/*
methods = POST, GET, DELETE

[expose:data/indexes]
pattern = data/indexes
methods = GET

# Custom expose entries for React UI REST API access

[expose:data_inputs_urc_app_input]
pattern = data/inputs/urc_app_input
methods = POST, GET

[expose:data_inputs_urc_app_input_specified]
pattern = data/inputs/urc_app_input/*
methods = POST, GET, DELETE
