# URC Extensions Schema — Splunk-specific extensions to the Airbyte CDK schema.
# These component types have no Airbyte equivalent.
---
$schema: "http://json-schema.org/draft-07/schema#"
title: URC Extensions Schema
description: >
  Splunk-specific extensions for the URC declarative connector engine.
  Defines event_timestamp components that resolve _time for Splunk events.

definitions:
  CursorBasedTimestamp:
    type: object
    description: >
      Derives _time from the stream's incremental_sync cursor field and
      datetime_format. Requires a sibling incremental_sync block on the stream.
    properties:
      type:
        type: string
        const: CursorBasedTimestamp
    required:
      - type
    additionalProperties: false

  FieldBasedTimestamp:
    type: object
    description: >
      Derives _time from an explicit record field with a given datetime format.
      Both field and format support Jinja2 interpolation.
    properties:
      type:
        type: string
        const: FieldBasedTimestamp
      field:
        type: string
        description: >
          Record field name (or Jinja2 template) containing the timestamp value.
      format:
        type: string
        description: >
          strftime format string (or Jinja2 template) for parsing the field value.
          Special values: "%s" for epoch seconds, "%ms" for epoch milliseconds.
        default: "%Y-%m-%dT%H:%M:%SZ"
    required:
      - type
      - field
    additionalProperties: false

  FetchTimestamp:
    type: object
    description: >
      Always returns the current wall-clock time as _time. Use when the API
      response contains no usable timestamp.
    properties:
      type:
        type: string
        const: FetchTimestamp
    required:
      - type
    additionalProperties: false

  EventTimestamp:
    description: >
      Union type for all event_timestamp strategies.
    oneOf:
      - $ref: "#/definitions/CursorBasedTimestamp"
      - $ref: "#/definitions/FieldBasedTimestamp"
      - $ref: "#/definitions/FetchTimestamp"
