version: '3'

dotenv: ['.env']

vars:
  ENV_FILE: '.env'
  COMPOSE_FILE: '.devcontainer/docker-compose.yml'
  SPLUNK_SERVICE: 'splunk'
  CONFIG_APPS_DIR: 'splunk/config/apps'
  DEPS_FILE: 'splunk/config/deps.yml'
  COMPOSE_STAGING_FILE: '.devcontainer/docker-compose.staging.yml'
  STAGE_DIR: 'splunk/stage'
  SPLUNK_BIN: '/opt/splunk/bin/splunk'
  SPLUNK_CONTAINER: 'splunk-dev'
  REACT_PACKAGES_DIR: 'react'

tasks:
  default:
    cmds:
      - task help
    desc: Show available tasks

  help:
    cmds:
      - |
        echo ""
        echo "Splunk Dev Container — task runner"
        echo "=================================="
        task --list
        echo ""
        echo "Common flows:"
        echo "  task splunk:build           # build dev Splunk image (first time / Dockerfile change)"
        echo "  task splunk:up              # start + sync app symlinks (no rebuild)"
        echo "  task splunk:refresh         # reload configs + static assets (no restart)"
        echo "  task splunk:restartd        # restart splunkd process (~10s)"
        echo "  task splunk:restart         # restart container (skips Ansible)"
        echo "  task splunk:reprovision     # force full Ansible re-provisioning"
        echo "  task splunk:clean           # stop + remove volumes (full reset)"
        echo ""
        echo "  task splunk:build-staging   # build staging image (apps baked in)"
        echo "  task splunk:up-staging      # start staging (port 18000)"
        echo "  task splunk:down-staging    # stop staging container"
        echo ""
        echo "  task app:create APP_NAME=x  # scaffold a new Splunk app"
        echo "  task app:provision          # package + install local apps"
        echo "  task deps:install           # install Splunkbase dependencies"
        echo ""
        echo "  task react:create           # scaffold + initial build, syncs APP_NAME in .env"
        echo "  task react:add-page         # add a page/component to existing app via @splunk/create"
        echo "  task react:link             # symlink stage/ into Splunk (run once after react:create)"
        echo "  task react:start            # webpack watch (stage/ updates live via symlink)"
        echo "  task react:build-install    # production build + package + install into Splunk"
    desc: Show available tasks and common flows

  # ── Internal helpers ─────────────────────────────────────────────────

  __dev-compose:
    internal: true
    cmds:
      - docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} {{.COMPOSE_ARGS}}

  # ── Dev Splunk Lifecycle ────────────────────────────────────────────

  splunk:build:
    cmds:
      - task: __dev-compose
        vars: { COMPOSE_ARGS: 'build {{.SPLUNK_SERVICE}}' }
    desc: Build the dev Splunk image

  splunk:up:
    cmds:
      - task: __dev-compose
        vars: { COMPOSE_ARGS: 'up -d' }
      - |
        echo "Waiting for Splunk to be ready..."
        for i in $(seq 1 36); do
          STATUS=$(docker exec {{.SPLUNK_CONTAINER}} bash -lc \
            "curl -sk -o /dev/null -w '%{http_code}' https://localhost:8089/services/server/health -u admin:\$SPLUNK_PASSWORD" 2>/dev/null || echo 000)
          [ "$STATUS" = "200" ] && echo "Splunk ready." && break
          [ "$i" = "36" ] && echo "Splunk did not become ready in time — run 'task app:sync-links' manually" && exit 0
          sleep 5
        done
      - task: app:sync-links
    desc: Start dev Splunk, wait for health, then sync app symlinks

  splunk:down:
    cmds:
      - task: __dev-compose
        vars: { COMPOSE_ARGS: 'down' }
    desc: Stop dev Splunk container

  splunk:clean:
    cmds:
      - task: __dev-compose
        vars: { COMPOSE_ARGS: 'down -v' }
    desc: Stop dev Splunk, remove containers and volumes (full reset)

  splunk:restart:
    cmds:
      - task: __dev-compose
        vars: { COMPOSE_ARGS: 'restart {{.SPLUNK_SERVICE}}' }
    desc: Restart dev Splunk container (entrypoint-wrapper skips Ansible)

  splunk:restartd:
    cmds:
      - task: __dev-compose
        vars: { COMPOSE_ARGS: 'exec {{.SPLUNK_SERVICE}} bash -lc "{{.SPLUNK_BIN}} restart -auth admin:\$SPLUNK_PASSWORD"' }
    desc: Restart splunkd process inside running container (~10s)

  splunk:refresh:
    cmds:
      - |
        DC="docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}}"
        echo "Reloading app configs..."
        $DC exec {{.SPLUNK_SERVICE}} bash -lc \
          'curl -sk -X POST https://localhost:8089/services/apps/local/_reload -u "admin:${SPLUNK_PASSWORD}" -o /dev/null -w "%{http_code}\n"'
        echo "Restarting Splunk Web (picks up static asset changes)..."
        $DC exec {{.SPLUNK_SERVICE}} bash -lc \
          'curl -sk -X POST https://localhost:8089/services/server/control/restart_webui -u "admin:${SPLUNK_PASSWORD}" -o /dev/null -w "%{http_code}\n"'
        echo "Done. Config and static assets reloaded (no restart needed)."
    desc: Reload app configs + static assets without restarting splunkd

  splunk:reprovision:
    cmds:
      - |
        echo "Removing provisioning marker and restarting..."
      - task: __dev-compose
        vars: { COMPOSE_ARGS: 'exec --user root {{.SPLUNK_SERVICE}} bash -c "rm -f /opt/splunk/var/.provisioned"' }
      - task: splunk:restart
      - |
        echo "Full Ansible provisioning will run. Follow with: task splunk:logs"
    desc: Force full Ansible re-provisioning (removes marker + restarts)

  splunk:status:
    cmds:
      - task: __dev-compose
        vars: { COMPOSE_ARGS: 'ps {{.SPLUNK_SERVICE}}' }
    desc: Check dev Splunk container status

  splunk:logs:
    cmds:
      - task: __dev-compose
        vars: { COMPOSE_ARGS: 'logs -f {{.SPLUNK_SERVICE}}' }
    desc: Follow dev Splunk container logs

  # ── Staging Splunk Lifecycle ───────────────────────────────────────

  splunk:build-staging:
    cmds:
      - docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_STAGING_FILE}} build --no-cache
    desc: Build staging Splunk image (apps baked in from splunk/stage/)

  splunk:up-staging:
    cmds:
      - docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_STAGING_FILE}} up -d
      - |
        echo "Staging Splunk started on port 18000 (Web), 18089 (REST), 18088 (HEC)"
        echo "Follow logs: task splunk:logs-staging"
    desc: Start staging Splunk (run splunk:build-staging first)

  splunk:down-staging:
    cmds:
      - docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_STAGING_FILE}} down
    desc: Stop staging Splunk container

  splunk:clean-staging:
    cmds:
      - docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_STAGING_FILE}} down -v
    desc: Stop staging Splunk, remove containers and volumes

  splunk:logs-staging:
    cmds:
      - docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_STAGING_FILE}} logs -f
    desc: Follow staging Splunk container logs

  # ── App Management ───────────────────────────────────────────────────

  app:sync-links:
    cmds:
      - |
        CONTAINER="{{.SPLUNK_CONTAINER}}"
        if ! docker ps --filter name="$CONTAINER" --format '{{`{{.Names}}`}}' | grep -q "^${CONTAINER}$"; then
          echo "Splunk container is not running — symlinks will be created on next 'task splunk:up'"
          exit 0
        fi
        echo "Syncing app symlinks in $CONTAINER ..."
        # Create symlinks for each app in /opt/splunk/dev-apps/
        docker exec --user root "$CONTAINER" bash -c '
          DEV_APPS="/opt/splunk/dev-apps"
          ETC_APPS="/opt/splunk/etc/apps"
          CREATED=0
          REPLACED=0
          SKIPPED=0
          if [ -d "$DEV_APPS" ]; then
            for APP_PATH in "$DEV_APPS"/*/; do
              [ -d "$APP_PATH" ] || continue
              APP=$(basename "$APP_PATH")
              # Skip hidden dirs
              case "$APP" in .*) continue ;; esac
              LINK="$ETC_APPS/$APP"
              if [ -L "$LINK" ]; then
                SKIPPED=$((SKIPPED + 1))
              else
                if [ -e "$LINK" ]; then
                  # Real dir/file exists (e.g. from Splunk provisioning) — replace with symlink
                  rm -rf "$LINK"
                  REPLACED=$((REPLACED + 1))
                fi
                ln -s "$DEV_APPS/$APP" "$LINK"
                CREATED=$((CREATED + 1))
              fi
            done
          fi
          # Clean up stale symlinks pointing to deleted app dirs
          CLEANED=0
          for LINK in "$ETC_APPS"/*; do
            [ -L "$LINK" ] || continue
            TARGET=$(readlink "$LINK")
            case "$TARGET" in "$DEV_APPS"/*)
              if [ ! -d "$TARGET" ]; then
                rm -f "$LINK"
                CLEANED=$((CLEANED + 1))
              fi
              ;;
            esac
          done
          echo "Symlinks: $CREATED created ($REPLACED replaced), $SKIPPED existing, $CLEANED stale removed"
        '
    desc: Create symlinks in Splunk etc/apps/ for each app in dev-apps/ (via docker exec)

  app:create:
    cmds:
      - |
        APP_NAME="{{.APP_NAME}}"
        if [ -z "${APP_NAME}" ] && [ -f "{{.ENV_FILE}}" ]; then
          APP_NAME=$(grep -E '^APP_NAME=' "{{.ENV_FILE}}" | head -1 | cut -d= -f2-)
        fi
        if [ -z "${APP_NAME}" ]; then echo "APP_NAME is required"; exit 1; fi
        APP_DIR="{{.CONFIG_APPS_DIR}}/${APP_NAME}"
        if [ -d "$APP_DIR" ]; then echo "App already exists: $APP_DIR"; exit 1; fi
        APP_LABEL=$(echo "${APP_NAME}" | tr '_-' '  ')
        echo "Creating app skeleton at $APP_DIR ..."
        mkdir -p "$APP_DIR/default" "$APP_DIR/metadata" "$APP_DIR/appserver/static" "$APP_DIR/bin"
        cat > "$APP_DIR/default/app.conf" << EOF
        [install]
        state = enabled
        is_configured = 0

        [ui]
        is_visible = 1
        label = ${APP_LABEL}

        [launcher]
        author = developer
        version = 1.0.0
        description = ${APP_LABEL}

        [package]
        id = ${APP_NAME}
        EOF
        # Dedent
        sed -i.bak 's/^        //' "$APP_DIR/default/app.conf" && rm -f "$APP_DIR/default/app.conf.bak"
        cat > "$APP_DIR/metadata/default.meta" << 'EOF'
        []
        access = read : [ * ], write : [ admin, power ]
        export = system
        EOF
        sed -i.bak 's/^        //' "$APP_DIR/metadata/default.meta" && rm -f "$APP_DIR/metadata/default.meta.bak"
        echo "App created: $APP_DIR"
      - task: app:sync-links
      - task: splunk:refresh
        ignore_error: true
    desc: Scaffold a new Splunk app, sync symlinks, and refresh Splunk

  app:package:
    cmds:
      - |
        APP_NAME="{{.APP_NAME}}"
        if [ -z "${APP_NAME}" ] && [ -f "{{.ENV_FILE}}" ]; then
          APP_NAME=$(grep -E '^APP_NAME=' "{{.ENV_FILE}}" | head -1 | cut -d= -f2-)
        fi
        if [ -z "${APP_NAME}" ]; then echo "APP_NAME is required"; exit 1; fi
        SRC_DIR="{{.CONFIG_APPS_DIR}}/${APP_NAME}"
        if [ ! -d "$SRC_DIR" ]; then echo "App not found: $SRC_DIR"; exit 1; fi
        mkdir -p "{{.STAGE_DIR}}"
        TAR_PATH="{{.STAGE_DIR}}/${APP_NAME}.tgz"
        echo "Packaging $SRC_DIR -> $TAR_PATH"
        tar -czf "$TAR_PATH" -C "{{.CONFIG_APPS_DIR}}" "${APP_NAME}"
        echo "Created $TAR_PATH"
    desc: Package splunk/config/apps/<APP_NAME> into splunk/stage/<APP_NAME>.tgz

  app:provision:
    cmds:
      - |
        APP_NAME="{{.APP_NAME}}"
        if [ -z "${APP_NAME}" ] && [ -f "{{.ENV_FILE}}" ]; then
          APP_NAME=$(grep -E '^APP_NAME=' "{{.ENV_FILE}}" | head -1 | cut -d= -f2-)
        fi
        APPS="{{.APPS}}"
        if [ -z "$APPS" ]; then
          if [ -n "${APP_NAME}" ]; then
            APPS="${APP_NAME}"
          else
            echo "APP_NAME is required (or pass APPS=app1,app2)"; exit 1
          fi
        fi
        echo "Provisioning: $APPS"
        mkdir -p {{.STAGE_DIR}}
        OLD_IFS="$IFS"; IFS=','
        for APP in $APPS; do
          IFS="$OLD_IFS"
          SRC_DIR="{{.CONFIG_APPS_DIR}}/${APP}"
          if [ ! -d "$SRC_DIR" ]; then echo "WARN: $SRC_DIR not found, skipping"; continue; fi
          TAR_PATH="{{.STAGE_DIR}}/${APP}.tgz"
          echo "Staging $SRC_DIR -> $TAR_PATH"
          tar -czf "$TAR_PATH" -C "{{.CONFIG_APPS_DIR}}" "$APP"
        done
        IFS="$OLD_IFS"
        IFS=','
        for APP in $APPS; do
          IFS="$OLD_IFS"
          PKG="{{.STAGE_DIR}}/${APP}.tgz"
          if [ -f "$PKG" ]; then
            echo "Installing $APP ..."
            docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} \
              exec --user splunk {{.SPLUNK_SERVICE}} bash -lc \
              "{{.SPLUNK_BIN}} install app /tmp/apps/${APP}.tgz -update 1 -auth admin:\$SPLUNK_PASSWORD" || true
          fi
        done
        IFS="$OLD_IFS"
        echo "Done. If Splunk requests a restart: task splunk:restartd"
    desc: Package and install local app(s) into running Splunk

  # ── Dependency Management ────────────────────────────────────────────

  deps:install:
    cmds:
      - python3 splunk/scripts/deps-install.py --env-file "{{.ENV_FILE}}" --deps-file "{{.DEPS_FILE}}" --stage-dir "{{.STAGE_DIR}}" --compose-file "{{.COMPOSE_FILE}}" --service "{{.SPLUNK_SERVICE}}"
    desc: Install Splunkbase dependencies from splunk/config/deps.yml (idempotent)

  # ── React Development ─────────────────────────────────────────────────
  #
  # @splunk/create convention:
  #   react/packages/<app>/stage/  ← webpack outputs a COMPLETE Splunk app here
  #   yarn start                   ← webpack watch, stage/ updates live
  #   yarn build                   ← production build to stage/
  #
  # Dev loop: react:create → react:link → react:start (webpack watch)
  #           Splunk reads stage/ directly via symlink — no copying needed.
  # Prod:     react:build-install → yarn build + package stage/ + splunk install app

  react:create:
    cmds:
      - |
        echo "Scaffolding React app with @splunk/create..."
        mkdir -p {{.REACT_PACKAGES_DIR}}
        cd {{.REACT_PACKAGES_DIR}} && npx @splunk/create
        echo ""
        echo "React app scaffolded."
      - |
        # Detect the app package: has webpack.config.js (the 'main' component lib does not)
        REACT_PKG=""
        for d in "{{.REACT_PACKAGES_DIR}}/packages"/*/; do
          [ -f "${d}webpack.config.js" ] || continue
          REACT_PKG=$(node -e "process.stdout.write(require('$(pwd)/${d}package.json').name.replace(/^@[^/]+\//,''))" 2>/dev/null || true)
          REACT_PATH="${d%/}"
          [ -n "$REACT_PKG" ] && break
        done
        if [ -z "$REACT_PKG" ]; then
          echo "Could not detect app package. Set APP_NAME manually in .env."
          exit 0
        fi
        echo "Detected app package: $REACT_PKG"
        # Sync APP_NAME in .env
        if [ -f "{{.ENV_FILE}}" ]; then
          if grep -q '^APP_NAME=' "{{.ENV_FILE}}"; then
            sed -i.bak "s|^APP_NAME=.*|APP_NAME=${REACT_PKG}|" "{{.ENV_FILE}}" && rm -f "{{.ENV_FILE}}.bak"
          else
            echo "APP_NAME=${REACT_PKG}" >> "{{.ENV_FILE}}"
          fi
          echo "Updated .env: APP_NAME=${REACT_PKG}"
        fi
        # Initial build so stage/ exists before linking
        echo "Running initial build in ${REACT_PATH}..."
        (cd "{{.REACT_PACKAGES_DIR}}" && yarn install)
        (cd "${REACT_PATH}" && yarn build)
        echo "Done. Run 'task react:link' to symlink into Splunk, then 'task react:start' to watch."
    desc: Scaffold React app via @splunk/create, detect app name, update .env, run initial build

  react:add-page:
    cmds:
      - |
        echo "Adding page/component via @splunk/create (interactive)..."
        cd {{.REACT_PACKAGES_DIR}} && npx @splunk/create
        echo "Installing new packages..."
        yarn install
        echo ""
        echo "Done. Run 'task react:start' to rebuild, or 'task react:build-install' for production."
    desc: Add a new page or component to existing app via @splunk/create (interactive)

  react:link:
    cmds:
      - |
        APP_NAME="{{.APP_NAME}}"
        if [ -z "${APP_NAME}" ] && [ -f "{{.ENV_FILE}}" ]; then
          APP_NAME=$(grep -E '^APP_NAME=' "{{.ENV_FILE}}" | head -1 | cut -d= -f2-)
        fi
        if [ -z "${APP_NAME}" ]; then echo "APP_NAME required"; exit 1; fi
        # Verify stage/ exists on the host before linking
        if [ -d "{{.REACT_PACKAGES_DIR}}/packages/${APP_NAME}/stage" ]; then
          STAGE_PATH="$(pwd)/{{.REACT_PACKAGES_DIR}}/packages/${APP_NAME}/stage"
        elif [ -d "{{.REACT_PACKAGES_DIR}}/${APP_NAME}/stage" ]; then
          STAGE_PATH="$(pwd)/{{.REACT_PACKAGES_DIR}}/${APP_NAME}/stage"
        else
          echo "stage/ not found — run 'task react:create' or 'task react:build-install' first"; exit 1
        fi
        # Use container-internal path — react/ is mounted at /opt/splunk/react inside the container
        CONTAINER_STAGE="/opt/splunk/react/packages/${APP_NAME}/stage"
        echo "Linking ${CONTAINER_STAGE} → /opt/splunk/etc/apps/${APP_NAME} (inside container)..."
        docker exec --user root {{.SPLUNK_CONTAINER}} bash -c "
          LINK=/opt/splunk/etc/apps/${APP_NAME}
          [ -L \"\$LINK\" ] && rm -f \"\$LINK\"
          [ -e \"\$LINK\" ] && rm -rf \"\$LINK\"
          ln -s ${CONTAINER_STAGE} \"\$LINK\"
          echo \"Linked: \$LINK → ${CONTAINER_STAGE}\"
        "
        task splunk:refresh
    desc: Symlink react/packages/<app>/stage/ directly into Splunk etc/apps/ (dev loop)

  react:start:
    cmds:
      - |
        APP_NAME="{{.APP_NAME}}"
        if [ -z "${APP_NAME}" ] && [ -f "{{.ENV_FILE}}" ]; then
          APP_NAME=$(grep -E '^APP_NAME=' "{{.ENV_FILE}}" | head -1 | cut -d= -f2-)
        fi
        REACT_PATH=""
        if [ -d "{{.REACT_PACKAGES_DIR}}/packages/${APP_NAME}" ]; then
          REACT_PATH="{{.REACT_PACKAGES_DIR}}/packages/${APP_NAME}"
        elif [ -d "{{.REACT_PACKAGES_DIR}}/${APP_NAME}" ]; then
          REACT_PATH="{{.REACT_PACKAGES_DIR}}/${APP_NAME}"
        else
          for d in "{{.REACT_PACKAGES_DIR}}/packages"/*/; do
            [ -f "${d}webpack.config.js" ] && REACT_PATH="${d%/}" && break
          done
        fi
        if [ -z "${REACT_PATH}" ]; then echo "Cannot resolve REACT_PATH — set APP_NAME in .env"; exit 1; fi
        echo "Starting webpack watch in ${REACT_PATH} (stage/ updates live via symlink)..."
        cd "${REACT_PATH}" && yarn start
    desc: webpack watch — stage/ updates live, Splunk reads changes via react:link symlink

  react:build-install:
    cmds:
      - |
        APP_NAME="{{.APP_NAME}}"
        if [ -z "${APP_NAME}" ] && [ -f "{{.ENV_FILE}}" ]; then
          APP_NAME=$(grep -E '^APP_NAME=' "{{.ENV_FILE}}" | head -1 | cut -d= -f2-)
        fi
        REACT_PATH=""
        if [ -d "{{.REACT_PACKAGES_DIR}}/packages/${APP_NAME}" ]; then
          REACT_PATH="{{.REACT_PACKAGES_DIR}}/packages/${APP_NAME}"
        elif [ -d "{{.REACT_PACKAGES_DIR}}/${APP_NAME}" ]; then
          REACT_PATH="{{.REACT_PACKAGES_DIR}}/${APP_NAME}"
        else
          for d in "{{.REACT_PACKAGES_DIR}}/packages"/*/; do
            [ -f "${d}webpack.config.js" ] && REACT_PATH="${d%/}" && break
          done
        fi
        if [ -z "${REACT_PATH}" ] || [ -z "${APP_NAME}" ]; then
          echo "Cannot resolve REACT_PATH — set APP_NAME in .env"; exit 1
        fi
        echo "Building ${APP_NAME} for production..."
        (cd "{{.REACT_PACKAGES_DIR}}" && yarn install)
        (cd "${REACT_PATH}" && yarn build)
        STAGE_PATH="${REACT_PATH}/stage"
        if [ ! -d "$STAGE_PATH" ]; then echo "Build failed — stage/ not found"; exit 1; fi
        echo "Packaging ${STAGE_PATH} → {{.STAGE_DIR}}/${APP_NAME}.tgz ..."
        mkdir -p {{.STAGE_DIR}}
        tar -czf "{{.STAGE_DIR}}/${APP_NAME}.tgz" -C "${REACT_PATH}" stage --transform "s|^stage|${APP_NAME}|"
        echo "Installing into Splunk..."
        docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} \
          exec --user splunk {{.SPLUNK_SERVICE}} bash -lc \
          "{{.SPLUNK_BIN}} install app /tmp/apps/${APP_NAME}.tgz -update 1 -auth admin:\$SPLUNK_PASSWORD" || true
        echo "Done. If Splunk requests a restart: task splunk:restartd"
    desc: Production build — yarn build, package stage/ as tgz, install into Splunk

  # ── Python Tooling ───────────────────────────────────────────────────

  python:lint:
    cmds:
      - ruff check {{.CONFIG_APPS_DIR}} || true
    desc: Lint Python code in splunk/config/apps/ with ruff

  python:format:
    cmds:
      - ruff format {{.CONFIG_APPS_DIR}} || true
    desc: Format Python code in splunk/config/apps/ with ruff

  python:test:
    cmds:
      - pytest {{.CONFIG_APPS_DIR}} || echo "No tests found or pytest not installed"
    desc: Run Python tests with pytest

  # ── Testing ─────────────────────────────────────────────────────────

  test:e2e:
    cmds:
      - |
        if command -v devcontainer &>/dev/null; then
          DC_CLI="devcontainer"
        else
          echo "devcontainer CLI not found, using npx..."
          DC_CLI="npx --yes @devcontainers/cli"
        fi
        echo "Running E2E tests (devcontainer CLI: $DC_CLI)"
        bash tests/e2e/devcontainer-test.sh
    desc: Run E2E devcontainer tests (build, up, tool checks, compose validation)

  test:native:
    cmds:
      - |
        echo "Running lifecycle tests natively (no devcontainer)..."
        bash tests/e2e/run-lifecycle.sh
    desc: Run Splunk lifecycle tests directly on Mac host (no devcontainer needed)

  test:all:
    cmds:
      - task: python:lint
      - task: test:e2e
    desc: Run all tests (lint + E2E devcontainer)

  # ── Utility ──────────────────────────────────────────────────────────

  env:setup:
    cmds:
      - |
        if [ ! -f "{{.ENV_FILE}}" ]; then
          if [ -f "splunk.env.example" ]; then
            cp splunk.env.example "{{.ENV_FILE}}"
            echo ".env created from splunk.env.example"
          else
            echo "No splunk.env.example found"
          fi
        else
          echo ".env already exists"
        fi
    desc: Create .env file from splunk.env.example