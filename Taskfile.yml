version: '3'

vars:
  ENV_FILE: '.env'
  COMPOSE_FILE: '.devcontainer/docker-compose.yml'
  COMPOSE_APPS_FILE: '.devcontainer/docker-compose.apps.yml'
  SPLUNK_SERVICE: 'splunk'
  CONFIG_APPS_DIR: 'splunk/config/apps'
  DEPS_FILE: 'splunk/config/deps.yml'
  STAGE_DIR: 'splunk/stage'
  SPLUNK_BIN: '/opt/splunk/bin/splunk'
  REACT_PACKAGES_DIR: 'packages'

tasks:
  default:
    cmds:
      - task help
    desc: Show available tasks

  help:
    cmds:
      - |
        echo ""
        echo "Splunk Dev Container — task runner"
        echo "=================================="
        task --list
        echo ""
        echo "Common flows:"
        echo "  task splunk:up              # build image + generate mounts + start"
        echo "  task splunk:logs            # follow container logs"
        echo "  task splunk:restartd        # restart splunkd inside container (~10s)"
        echo "  task splunk:reprovision     # force full Ansible re-provisioning"
        echo "  task splunk:clean           # stop + remove volumes (full reset)"
        echo ""
        echo "  task app:create APP_NAME=x  # scaffold a new Splunk app"
        echo "  task app:provision          # package + install local apps"
        echo "  task deps:install           # install Splunkbase dependencies"
        echo ""
        echo "  task react:create           # scaffold React app (npx @splunk/create)"
        echo "  task react:start            # dev server with HMR (port 3000)"
        echo "  task react:build-install    # build + copy to app + package + install"
    desc: Show available tasks and common flows

  # ── Internal helpers ─────────────────────────────────────────────────

  __load-app-name:
    internal: true
    cmds:
      - |
        if [ -z "${APP_NAME}" ] && [ -f "{{.ENV_FILE}}" ]; then
          APP_NAME=$(grep -E '^APP_NAME=' "{{.ENV_FILE}}" | head -1 | cut -d= -f2-)
          export APP_NAME
        fi

  __compose:
    internal: true
    cmds:
      - |
        EXTRA_FILES=""
        if [ -f "{{.COMPOSE_APPS_FILE}}" ]; then
          EXTRA_FILES="-f {{.COMPOSE_APPS_FILE}}"
        fi
        docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} $EXTRA_FILES {{.CLI_ARGS}}

  # ── Splunk Lifecycle ─────────────────────────────────────────────────

  splunk:build:
    cmds:
      - docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} build {{.SPLUNK_SERVICE}}
    desc: Build the custom Splunk image

  splunk:up:
    cmds:
      - task: app:generate-mounts
      - |
        EXTRA_FILES=""
        if [ -f "{{.COMPOSE_APPS_FILE}}" ]; then
          EXTRA_FILES="-f {{.COMPOSE_APPS_FILE}}"
        fi
        docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} $EXTRA_FILES up -d --build
    desc: Generate app mounts, build image, and start Splunk

  splunk:down:
    cmds:
      - |
        EXTRA_FILES=""
        if [ -f "{{.COMPOSE_APPS_FILE}}" ]; then
          EXTRA_FILES="-f {{.COMPOSE_APPS_FILE}}"
        fi
        docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} $EXTRA_FILES down
    desc: Stop Splunk and remove containers

  splunk:clean:
    cmds:
      - |
        EXTRA_FILES=""
        if [ -f "{{.COMPOSE_APPS_FILE}}" ]; then
          EXTRA_FILES="-f {{.COMPOSE_APPS_FILE}}"
        fi
        docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} $EXTRA_FILES down -v
    desc: Stop Splunk, remove containers and volumes (full reset)

  splunk:restart:
    cmds:
      - |
        EXTRA_FILES=""
        if [ -f "{{.COMPOSE_APPS_FILE}}" ]; then
          EXTRA_FILES="-f {{.COMPOSE_APPS_FILE}}"
        fi
        docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} $EXTRA_FILES restart {{.SPLUNK_SERVICE}}
    desc: Restart Splunk container (entrypoint-wrapper skips Ansible)

  splunk:restartd:
    cmds:
      - |
        EXTRA_FILES=""
        if [ -f "{{.COMPOSE_APPS_FILE}}" ]; then
          EXTRA_FILES="-f {{.COMPOSE_APPS_FILE}}"
        fi
        docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} $EXTRA_FILES \
          exec {{.SPLUNK_SERVICE}} bash -lc \
          "{{.SPLUNK_BIN}} restart -auth admin:${SPLUNK_PASSWORD}"
    desc: Restart splunkd inside the running container (~10s, no Ansible)

  splunk:reprovision:
    cmds:
      - |
        echo "Removing provisioning marker and restarting..."
        EXTRA_FILES=""
        if [ -f "{{.COMPOSE_APPS_FILE}}" ]; then
          EXTRA_FILES="-f {{.COMPOSE_APPS_FILE}}"
        fi
        docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} $EXTRA_FILES \
          exec {{.SPLUNK_SERVICE}} bash -c "rm -f /opt/splunk/var/.provisioned" || true
        docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} $EXTRA_FILES \
          restart {{.SPLUNK_SERVICE}}
        echo "Full Ansible provisioning will run. Follow with: task splunk:logs"
    desc: Force full Ansible re-provisioning (removes marker + restarts)

  splunk:status:
    cmds:
      - |
        EXTRA_FILES=""
        if [ -f "{{.COMPOSE_APPS_FILE}}" ]; then
          EXTRA_FILES="-f {{.COMPOSE_APPS_FILE}}"
        fi
        docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} $EXTRA_FILES ps {{.SPLUNK_SERVICE}}
    desc: Check Splunk container status

  splunk:logs:
    cmds:
      - |
        EXTRA_FILES=""
        if [ -f "{{.COMPOSE_APPS_FILE}}" ]; then
          EXTRA_FILES="-f {{.COMPOSE_APPS_FILE}}"
        fi
        docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} $EXTRA_FILES logs -f {{.SPLUNK_SERVICE}}
    desc: Follow Splunk container logs

  # ── App Management ───────────────────────────────────────────────────

  app:generate-mounts:
    cmds:
      - |
        echo "Generating app bind mounts..."
        APPS_DIR="{{.CONFIG_APPS_DIR}}"
        OUT_FILE="{{.COMPOSE_APPS_FILE}}"
        mkdir -p "$(dirname "$OUT_FILE")"

        # Header
        cat > "$OUT_FILE" << 'HEADER'
        # Auto-generated by: task app:generate-mounts
        # Do not edit — regenerated on every 'task splunk:up'
        services:
          splunk:
            volumes:
        HEADER

        # Dedent the heredoc output (it was indented for readability)
        sed -i.bak 's/^        //' "$OUT_FILE" && rm -f "${OUT_FILE}.bak"

        # Add a mount for each app directory
        FOUND=0
        if [ -d "$APPS_DIR" ]; then
          for APP_PATH in "$APPS_DIR"/*/; do
            [ -d "$APP_PATH" ] || continue
            APP=$(basename "$APP_PATH")
            # Skip hidden dirs and .DS_Store
            [[ "$APP" == .* ]] && continue
            echo "      - \${LOCAL_WORKSPACE_FOLDER:-.}/${APPS_DIR}/${APP}:/opt/splunk/etc/apps/${APP}" >> "$OUT_FILE"
            FOUND=$((FOUND + 1))
          done
        fi

        if [ $FOUND -eq 0 ]; then
          # docker-compose needs at least one valid entry or empty volumes
          echo "      # No app directories found in ${APPS_DIR}/" >> "$OUT_FILE"
          echo "      - \${LOCAL_WORKSPACE_FOLDER:-.}/splunk/stage:/tmp/apps-mounts-placeholder:ro" >> "$OUT_FILE"
        fi

        echo "Generated $OUT_FILE with $FOUND app mount(s)"
    desc: Scan splunk/config/apps/ and generate docker-compose.apps.yml

  app:create:
    cmds:
      - |
        if [ -z "${APP_NAME}" ] && [ -f "{{.ENV_FILE}}" ]; then
          APP_NAME=$(grep -E '^APP_NAME=' "{{.ENV_FILE}}" | head -1 | cut -d= -f2-)
        fi
        if [ -z "${APP_NAME}" ]; then echo "APP_NAME is required"; exit 1; fi
        APP_DIR="{{.CONFIG_APPS_DIR}}/${APP_NAME}"
        if [ -d "$APP_DIR" ]; then echo "App already exists: $APP_DIR"; exit 1; fi
        echo "Creating app skeleton at $APP_DIR ..."
        mkdir -p "$APP_DIR/default" "$APP_DIR/metadata" "$APP_DIR/appserver/static" "$APP_DIR/bin"
        cat > "$APP_DIR/default/app.conf" << EOF
        [install]
        state = enabled
        is_configured = 0

        [ui]
        is_visible = 1
        label = ${APP_NAME}

        [launcher]
        author = developer
        version = 1.0.0
        description = ${APP_NAME}

        [package]
        id = ${APP_NAME}
        EOF
        # Dedent
        sed -i.bak 's/^        //' "$APP_DIR/default/app.conf" && rm -f "$APP_DIR/default/app.conf.bak"
        cat > "$APP_DIR/metadata/default.meta" << 'EOF'
        []
        access = read : [ * ], write : [ admin, power ]
        export = system
        EOF
        sed -i.bak 's/^        //' "$APP_DIR/metadata/default.meta" && rm -f "$APP_DIR/metadata/default.meta.bak"
        echo "App created: $APP_DIR"
        echo "Run 'task splunk:up' to mount it into Splunk"
    desc: Scaffold a new Splunk app at splunk/config/apps/<APP_NAME>

  app:package:
    cmds:
      - |
        if [ -z "${APP_NAME}" ] && [ -f "{{.ENV_FILE}}" ]; then
          APP_NAME=$(grep -E '^APP_NAME=' "{{.ENV_FILE}}" | head -1 | cut -d= -f2-)
        fi
        if [ -z "${APP_NAME}" ]; then echo "APP_NAME is required"; exit 1; fi
        SRC_DIR="{{.CONFIG_APPS_DIR}}/${APP_NAME}"
        if [ ! -d "$SRC_DIR" ]; then echo "App not found: $SRC_DIR"; exit 1; fi
        mkdir -p "{{.STAGE_DIR}}"
        TAR_PATH="{{.STAGE_DIR}}/${APP_NAME}.tgz"
        echo "Packaging $SRC_DIR -> $TAR_PATH"
        tar -czf "$TAR_PATH" -C "{{.CONFIG_APPS_DIR}}" "${APP_NAME}"
        echo "Created $TAR_PATH"
    desc: Package splunk/config/apps/<APP_NAME> into splunk/stage/<APP_NAME>.tgz

  app:provision:
    cmds:
      - |
        if [ -z "${APP_NAME}" ] && [ -f "{{.ENV_FILE}}" ]; then
          APP_NAME=$(grep -E '^APP_NAME=' "{{.ENV_FILE}}" | head -1 | cut -d= -f2-)
        fi
        APPS="${APPS}"
        if [ -z "$APPS" ]; then
          APPS="splunk-config-dev"
          if [ -n "${APP_NAME}" ]; then
            APPS="${APPS},${APP_NAME}"
          fi
        fi
        echo "Provisioning: $APPS"
        IFS=',' read -r -a ARR <<< "$APPS"
        mkdir -p {{.STAGE_DIR}}
        EXTRA_FILES=""
        if [ -f "{{.COMPOSE_APPS_FILE}}" ]; then
          EXTRA_FILES="-f {{.COMPOSE_APPS_FILE}}"
        fi
        for APP in "${ARR[@]}"; do
          SRC_DIR="{{.CONFIG_APPS_DIR}}/${APP}"
          if [ ! -d "$SRC_DIR" ]; then echo "WARN: $SRC_DIR not found, skipping"; continue; fi
          TAR_PATH="{{.STAGE_DIR}}/${APP}.tgz"
          echo "Staging $SRC_DIR -> $TAR_PATH"
          tar -czf "$TAR_PATH" -C "{{.CONFIG_APPS_DIR}}" "$APP"
        done
        for APP in "${ARR[@]}"; do
          PKG="{{.STAGE_DIR}}/${APP}.tgz"
          if [ -f "$PKG" ]; then
            echo "Installing $APP ..."
            docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} $EXTRA_FILES \
              exec {{.SPLUNK_SERVICE}} bash -lc \
              "{{.SPLUNK_BIN}} install app /tmp/apps/${APP}.tgz -update 1 -auth admin:${SPLUNK_PASSWORD}" || true
          fi
        done
        echo "Done. If Splunk requests a restart: task splunk:restartd"
    desc: Package and install local app(s) into running Splunk

  # ── Dependency Management ────────────────────────────────────────────

  deps:install:
    cmds:
      - |
        DEPS_FILE="{{.DEPS_FILE}}"
        if [ ! -f "$DEPS_FILE" ]; then
          echo "No deps file at $DEPS_FILE"; exit 0;
        fi

        EXTRA_FILES=""
        if [ -f "{{.COMPOSE_APPS_FILE}}" ]; then
          EXTRA_FILES="-f {{.COMPOSE_APPS_FILE}}"
        fi

        mkdir -p {{.STAGE_DIR}}

        # Parse deps.yml (simple line-based parser — no yq required)
        # Format: name, splunkbase_id, version, url fields under dependencies:
        IN_DEPS=false
        CURRENT_NAME=""
        CURRENT_ID=""
        CURRENT_VERSION=""
        CURRENT_URL=""

        process_dep() {
          if [ -z "$CURRENT_NAME" ]; then return; fi

          echo "Checking dependency: $CURRENT_NAME"

          # Check if already installed
          INSTALLED_VER=$(docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} $EXTRA_FILES \
            exec -T {{.SPLUNK_SERVICE}} bash -lc \
            "{{.SPLUNK_BIN}} display app $CURRENT_NAME -auth admin:${SPLUNK_PASSWORD} 2>/dev/null | grep -oP 'version=\K[^ ]+'" 2>/dev/null || echo "")

          if [ -n "$INSTALLED_VER" ] && [ "$INSTALLED_VER" = "$CURRENT_VERSION" ]; then
            echo "  Already installed: $CURRENT_NAME v$INSTALLED_VER (skipping)"
            return
          fi

          TAR_PATH="{{.STAGE_DIR}}/${CURRENT_NAME}.tgz"

          if [ -n "$CURRENT_URL" ]; then
            # Direct URL download
            echo "  Downloading from URL: $CURRENT_URL"
            curl -fSL -o "$TAR_PATH" "$CURRENT_URL" || { echo "  ERROR: download failed"; return; }
          elif [ -n "$CURRENT_ID" ] && [ -n "$CURRENT_VERSION" ]; then
            # Splunkbase download
            if [ -z "${SPLUNKBASE_USERNAME}" ] || [ -z "${SPLUNKBASE_PASSWORD}" ]; then
              echo "  ERROR: SPLUNKBASE_USERNAME and SPLUNKBASE_PASSWORD required for Splunkbase downloads"
              return
            fi
            DL_URL="https://splunkbase.splunk.com/app/${CURRENT_ID}/release/${CURRENT_VERSION}/download"
            echo "  Downloading from Splunkbase: $CURRENT_NAME v$CURRENT_VERSION"
            curl -fSL -u "${SPLUNKBASE_USERNAME}:${SPLUNKBASE_PASSWORD}" -o "$TAR_PATH" "$DL_URL" \
              || { echo "  ERROR: Splunkbase download failed (check creds/version)"; return; }
          else
            echo "  ERROR: need either url or splunkbase_id+version"
            return
          fi

          echo "  Installing $CURRENT_NAME ..."
          docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} $EXTRA_FILES \
            exec -T {{.SPLUNK_SERVICE}} bash -lc \
            "{{.SPLUNK_BIN}} install app /tmp/apps/${CURRENT_NAME}.tgz -update 1 -auth admin:${SPLUNK_PASSWORD}" || true
        }

        while IFS= read -r line || [ -n "$line" ]; do
          # Skip comments and empty lines
          [[ "$line" =~ ^[[:space:]]*# ]] && continue
          [[ "$line" =~ ^[[:space:]]*$ ]] && continue

          # Detect dependencies: section
          if echo "$line" | grep -qE '^dependencies:'; then
            IN_DEPS=true; continue
          fi

          # Outside dependencies section
          if [ "$IN_DEPS" != "true" ]; then continue; fi

          # New dependency item (starts with "  - name:")
          if echo "$line" | grep -qE '^\s*-\s*name:'; then
            # Process previous dep
            process_dep
            CURRENT_NAME=$(echo "$line" | sed 's/.*name:\s*//' | tr -d '"' | tr -d "'")
            CURRENT_ID=""
            CURRENT_VERSION=""
            CURRENT_URL=""
            continue
          fi

          # Parse fields
          if echo "$line" | grep -qE '^\s+splunkbase_id:'; then
            CURRENT_ID=$(echo "$line" | sed 's/.*splunkbase_id:\s*//' | tr -d '"' | tr -d "'")
          elif echo "$line" | grep -qE '^\s+version:'; then
            CURRENT_VERSION=$(echo "$line" | sed 's/.*version:\s*//' | tr -d '"' | tr -d "'")
          elif echo "$line" | grep -qE '^\s+url:'; then
            CURRENT_URL=$(echo "$line" | sed 's/.*url:\s*//' | tr -d '"' | tr -d "'")
          fi
        done < "$DEPS_FILE"

        # Process last dep
        process_dep

        echo "Dependency install complete. If Splunk requests a restart: task splunk:restartd"
    desc: Install Splunkbase dependencies from splunk/config/deps.yml (idempotent)

  # ── React Development ────────────────────────────────────────────────

  react:create:
    cmds:
      - |
        echo "Scaffolding React app with @splunk/create..."
        mkdir -p {{.REACT_PACKAGES_DIR}}
        cd {{.REACT_PACKAGES_DIR}} && npx @splunk/create
        echo ""
        echo "Next: task react:start REACT_PATH=packages/<app-name>"
    desc: Scaffold a new React Splunk app (npx @splunk/create)

  react:start:
    cmds:
      - |
        if [ -z "${REACT_PATH}" ] && [ -z "${APP_NAME}" ] && [ -f "{{.ENV_FILE}}" ]; then
          APP_NAME=$(grep -E '^APP_NAME=' "{{.ENV_FILE}}" | head -1 | cut -d= -f2-)
        fi
        if [ -z "${REACT_PATH}" ] && [ -n "${APP_NAME}" ]; then
          if [ -d "{{.REACT_PACKAGES_DIR}}/${APP_NAME}" ]; then
            REACT_PATH="{{.REACT_PACKAGES_DIR}}/${APP_NAME}"
          fi
        fi
        if [ -z "${REACT_PATH}" ]; then echo "REACT_PATH or APP_NAME required"; exit 1; fi
        echo "Starting React dev server in ${REACT_PATH}..."
        cd "${REACT_PATH}"
        if [ -f "yarn.lock" ]; then
          yarn start
        else
          npm start
        fi
    desc: Start React dev server with HMR (port 3000)

  react:build-install:
    cmds:
      - |
        if [ -z "${APP_NAME}" ] && [ -f "{{.ENV_FILE}}" ]; then
          APP_NAME=$(grep -E '^APP_NAME=' "{{.ENV_FILE}}" | head -1 | cut -d= -f2-)
        fi
        if [ -z "${REACT_PATH}" ] && [ -n "${APP_NAME}" ]; then
          if [ -d "{{.REACT_PACKAGES_DIR}}/${APP_NAME}" ]; then
            REACT_PATH="{{.REACT_PACKAGES_DIR}}/${APP_NAME}"
          fi
        fi
        if [ -z "${REACT_PATH}" ] || [ -z "${APP_NAME}" ]; then
          echo "REACT_PATH and APP_NAME are required"; exit 1;
        fi
        APP_DIR="{{.CONFIG_APPS_DIR}}/${APP_NAME}"
        DEST_DIR="${APP_DIR}/appserver/static"
        if [ -n "${STATIC_SUBDIR}" ]; then DEST_DIR="${DEST_DIR}/${STATIC_SUBDIR}"; fi
        if [ ! -d "$APP_DIR" ]; then echo "App not found: $APP_DIR"; exit 1; fi
        if [ ! -f "${REACT_PATH}/package.json" ]; then echo "No package.json in ${REACT_PATH}"; exit 1; fi

        echo "Building React app in ${REACT_PATH}..."
        (cd "${REACT_PATH}" && \
          if [ -f "yarn.lock" ]; then yarn install && yarn build; else npm install && npm run build; fi)

        # Find build output
        BUILD_DIR="${REACT_PATH}/build"
        [ -d "$BUILD_DIR" ] || BUILD_DIR="${REACT_PATH}/dist"
        [ -d "$BUILD_DIR" ] || { echo "No build output found (tried build/, dist/)"; exit 1; }

        echo "Copying to $DEST_DIR ..."
        mkdir -p "$DEST_DIR"
        rsync -a --delete "$BUILD_DIR"/ "$DEST_DIR"/

        echo "Packaging and installing ${APP_NAME}..."
        mkdir -p {{.STAGE_DIR}}
        tar -czf "{{.STAGE_DIR}}/${APP_NAME}.tgz" -C "{{.CONFIG_APPS_DIR}}" "${APP_NAME}"

        EXTRA_FILES=""
        if [ -f "{{.COMPOSE_APPS_FILE}}" ]; then
          EXTRA_FILES="-f {{.COMPOSE_APPS_FILE}}"
        fi
        docker compose --env-file {{.ENV_FILE}} -f {{.COMPOSE_FILE}} $EXTRA_FILES \
          exec {{.SPLUNK_SERVICE}} bash -lc \
          "{{.SPLUNK_BIN}} install app /tmp/apps/${APP_NAME}.tgz -update 1 -auth admin:${SPLUNK_PASSWORD}" || true
        echo "Done. If Splunk requests a restart: task splunk:restartd"
    desc: Build React app, copy to appserver/static, package, and install

  # ── Python Tooling ───────────────────────────────────────────────────

  python:lint:
    cmds:
      - |
        echo "Linting Python code with ruff..."
        ruff check {{.CONFIG_APPS_DIR}} {{.REACT_PACKAGES_DIR}} || true
    desc: Lint Python code with ruff

  python:format:
    cmds:
      - |
        echo "Formatting Python code with ruff..."
        ruff format {{.CONFIG_APPS_DIR}} {{.REACT_PACKAGES_DIR}} || true
    desc: Format Python code with ruff

  python:test:
    cmds:
      - |
        echo "Running Python tests..."
        pytest || echo "No tests found or pytest not installed"
    desc: Run Python tests with pytest

  # ── Utility ──────────────────────────────────────────────────────────

  env:setup:
    cmds:
      - |
        if [ ! -f "{{.ENV_FILE}}" ]; then
          if [ -f "splunk.env.example" ]; then
            cp splunk.env.example "{{.ENV_FILE}}"
            echo ".env created from splunk.env.example"
          else
            echo "No splunk.env.example found"
          fi
        else
          echo ".env already exists"
        fi
    desc: Create .env file from splunk.env.example