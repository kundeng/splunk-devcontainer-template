# Splunkbase app dependencies — installed idempotently via: task deps:install
#
# Supported formats:
#   splunkbase_id + version  → downloads from Splunkbase API (requires creds in .env)
#   url                      → downloads directly from URL
#
# Dependencies are installed into the running Splunk container.
# They persist in the splunk-var volume across restarts.

dependencies:
  - name: Splunk_SA_Scientific_Python_linux_x86_64
    splunkbase_id: 2882
    version: "4.2.3"

  - name: Splunk_App_for_Anomaly_Detection
    splunkbase_id: 6843
    version: "1.1.2"

